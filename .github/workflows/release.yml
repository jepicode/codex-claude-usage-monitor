name: Windows release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run tests
        run: dotnet test .\tests\QuotaParser.Tests.csproj --configuration Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build installer
        shell: pwsh
        run: .\build-installer.ps1
      - name: Validate package and write checksum
        shell: pwsh
        run: |
          $package = 'dist\CodexClaudeUsageWidget-Setup.zip'
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
              throw "Installer package not found: $package"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $package))
          try {
              $names = @($archive.Entries | ForEach-Object FullName)
              foreach ($required in @('CodexClaudeUsageWidget.exe', 'Install.ps1', 'Uninstall.ps1')) {
                  if ($names -notcontains $required) { throw "Package is missing $required" }
              }
          }
          finally {
              $archive.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $package)" | Set-Content -LiteralPath 'dist\SHA256SUMS.txt' -Encoding ascii
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            dist/CodexClaudeUsageWidget-Setup.zip
            dist/SHA256SUMS.txt
